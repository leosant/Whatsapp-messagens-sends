<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Message Sender</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="container">
        <h1>WhatsApp Message Sender</h1>
        <form id="messageForm">
            <div class="form-group">
                <label for="phone">Número de Telefone:</label>
                <input type="text" id="phone" name="phone" placeholder="5511999999999" required>
                <small>Inclua o código do país (ex: 55) e DDD, sem caracteres especiais</small>
            </div>
            <div class="form-group">
                <label for="message">Mensagem:</label>
                <textarea id="message" name="message" required></textarea>
            </div>
            <button type="submit">Enviar Mensagem</button>
        </form>
        <div id="status"></div>
    </div>

    <script>
        document.getElementById('messageForm').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const phone = document.getElementById('phone').value;
            const message = document.getElementById('message').value;
            const statusDiv = document.getElementById('status');
            
            try {
                const response = await fetch('/send-message', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({ phone, message }),
                });

                const data = await response.json();
                
                statusDiv.style.display = 'block';
                if (response.ok) {
                    statusDiv.className = 'success';
                    statusDiv.textContent = 'Mensagem enviada com sucesso!';
                } else {
                    statusDiv.className = 'error';
                    statusDiv.textContent = data.error || 'Erro ao enviar mensagem';
                }
            } catch (error) {
                statusDiv.style.display = 'block';
                statusDiv.className = 'error';
                statusDiv.textContent = 'Erro ao enviar mensagem';
            }
        });
    </script>
</body>
</html>
