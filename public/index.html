<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WhatsApp Message Sender</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
    <link href="/css/styles.css" rel="stylesheet">
    <script src="https://cdn.rawgit.com/davidshimjs/qrcodejs/gh-pages/qrcode.min.js"></script>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow">
                    <div class="card-body">
                        <h2 class="text-center mb-4">WhatsApp Sender</h2>
                        
                        <!-- Status da Conexão -->
                        <div id="connectionStatus" class="text-center mb-4">
                            <div class="status-badge disconnected">
                                <i class="bi bi-x-circle"></i>
                                <span id="statusText">Desconectado</span>
                            </div>
                            
                            <!-- Área do QR Code -->
                            <div id="qrCodeContainer" class="mt-3 mb-3" style="display: none;">
                                <div class="qr-code-wrapper">
                                    <canvas id="qrCodeCanvas"></canvas>
                                </div>
                                <p class="mt-2 text-muted">Escaneie o QR Code com o WhatsApp no seu celular</p>
                                <!-- Loading após scan do QR -->
                                <div id="authLoadingContainer" class="mt-3" style="display: none;">
                                    <div class="d-flex flex-column align-items-center">
                                        <div class="spinner-border text-primary" role="status">
                                            <span class="visually-hidden">Carregando...</span>
                                        </div>
                                        <p class="mt-2 text-primary" id="loadingText">Iniciando WhatsApp...</p>
                                        <p class="text-muted small" id="loadingPercent"></p>
                                    </div>
                                </div>
                            </div>
                        </div>

                        <!-- Formulário de Mensagem -->
                        <form id="messageForm" style="display: none;">
                            <div class="mb-3">
                                <label for="phone" class="form-label">Número do WhatsApp</label>
                                <input type="text" class="form-control" id="phone" 
                                    placeholder="Ex: 61984245554" 
                                    pattern="[0-9]+"
                                    title="Digite apenas números, com DDD"
                                    required>
                                <div class="form-text">
                                    Digite o número com DDD.<br>
                                    Exemplo: 61984245554
                                </div>
                            </div>
                            <div class="mb-3">
                                <label for="message" class="form-label">Mensagem</label>
                                <textarea class="form-control" id="message" rows="3" required></textarea>
                            </div>
                            <button type="submit" class="btn btn-primary w-100">Enviar Mensagem</button>
                        </form>
                        <div id="response" class="mt-3"></div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Loading Overlay -->
    <div class="loading-overlay" id="loadingOverlay">
        <div class="text-center">
            <div class="spinner"></div>
            <div class="loading-text">Enviando mensagem...</div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/js/services.js"></script>
</body>
</html>
